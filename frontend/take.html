<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TestGen — тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;600;700;800;900&family=Onest:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="/style.css?v=11" />
</head>
<body>
<header>
  <div class="brand"><span class="logo" aria-hidden="true"></span><span>TEST<b>GEN</b></span></div>
  <div class="lang-switch" style="margin-left:auto">
    <button data-lang="kz" onclick="setLang('kz')">KZ</button>
    <button data-lang="ru" onclick="setLang('ru')">RU</button>
    <button data-lang="en" onclick="setLang('en')">EN</button>
  </div>
</header>

<main class="narrow">
  <div id="loading" class="center-msg"><span class="spinner"></span></div>
  <div id="message" class="card center-msg hidden"></div>

  <!-- start -->
  <section id="view-start" class="hidden">
    <form class="card accent-top" onsubmit="startTest(event)">
      <h1 id="start-title"></h1>
      <p class="meta" id="start-meta"></p>
      <ul class="rules" id="start-rules"></ul>
      <label class="field"><span data-i18n="full_name"></span>
        <input type="text" id="student-name" data-i18n-ph="full_name_ph" required minlength="2" maxlength="80" autocomplete="name" />
      </label>
      <label class="field"><span data-i18n="group"></span>
        <input type="text" id="student-group" data-i18n-ph="group_ph" maxlength="40" />
      </label>
      <div class="status err" id="start-status"></div>
      <button class="primary big" type="submit" id="start-btn" data-i18n="start"></button>
    </form>
  </section>

  <!-- questions -->
  <section id="view-quiz" class="hidden">
    <div class="card accent-top test-head">
      <h1 id="quiz-title"></h1>
      <p class="meta" id="quiz-student"></p>
      <ul class="rules" id="quiz-rules"></ul>
    </div>
    <div class="timer hidden" id="timer"></div>
    <div id="questions"></div>
    <div class="status err" id="submit-status"></div>
    <button class="primary big" id="submit-btn" onclick="onMainButton()" data-i18n="submit"></button>
  </section>

  <!-- result -->
  <section id="view-result" class="hidden">
    <div class="card accent-top score-hero" id="score-hero"></div>
    <div id="review"></div>
  </section>
</main>

<div id="cam-box" class="cam-box hidden">
  <video id="cam-video" autoplay muted playsinline></video>
  <canvas id="cam-overlay" class="cam-overlay" aria-hidden="true"></canvas>
  <span class="cam-status"><i></i><span data-i18n="camera_watching"></span></span>
</div>

<script src="/i18n.js?v=11"></script>
<script src="/bg.js?v=11"></script>
<script src="/proctor.js?v=11"></script>
<script src="/take.js?v=11"></script>
</body>
</html>
